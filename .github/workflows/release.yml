name: Release

# Only on a tag you push deliberately. Every push to main already deploys;
# a release is the separate act of naming a point you could come back to.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so the notes can be generated against the
          # previous tag rather than against a ten-commit shallow clone.
          fetch-depth: 0

      # No gate here. A tag names a commit that is already on main, which Check
      # has answered for and Vercel has deployed — running the same four steps
      # against the same tree would only tell us what we were told twice
      # already. `--verify-tag` is the part that still matters: it refuses to
      # publish a release for a tag that is not actually in the repository.
      - name: Cut the release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
